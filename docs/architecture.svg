<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="CloudGenie coordinator and year specialists with reviewed local cleanup"><rect width="1200" height="1200" fill="white" /><text x="60" y="49" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">CloudGenie Library Agents</text><text x="60" y="83" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#17212b">Read sources, collect evidence, consolidate knowledge, then review cleanup</text><rect x="60" y="117" width="1080" height="76" rx="7" fill="#e9f2fa" stroke="#9ba5ae" /><text x="600.0" y="146" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Inputs stay read-only during analysis</text><text x="600.0" y="171" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Extracted Google Takeout and local folders | No cloud credentials or deletion</text><rect x="370" y="237" width="460" height="79" rx="7" fill="#f1f3f5" stroke="#9ba5ae" /><text x="600.0" y="266" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Main coordinator and inventory</text><text x="600.0" y="291" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Discover files, infer years, schedule jobs</text><polyline points="600,193 600,237" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="600,237 595,228 605,228" fill="#5b6874" /><rect x="60" y="365" width="320" height="75" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="220.0" y="394" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Year 2019</text><text x="220.0" y="419" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">One queue per format specialist</text><polyline points="600,316 600,338 220,338 220,365" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="220,365 215,356 225,356" fill="#5b6874" /><rect x="440" y="365" width="320" height="75" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="600.0" y="394" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Year 2024</text><text x="600.0" y="419" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">One queue per format specialist</text><polyline points="600,316 600,338 600,338 600,365" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="600,365 595,356 605,356" fill="#5b6874" /><rect x="820" y="365" width="320" height="75" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="980.0" y="394" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Every selected year</text><text x="980.0" y="419" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">One queue per format specialist</text><polyline points="600,316 600,338 980,338 980,365" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="980,365 975,356 985,356" fill="#5b6874" /><text x="600" y="476" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#17212b">Each year can dispatch all three specialist roles</text><rect x="60" y="513" width="320" height="103" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="220.0" y="542" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Document agent</text><text x="220.0" y="567" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">PDF PPTX DOCX XLSX text</text><text x="220.0" y="589" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Text, notes, tables and URLs</text><polyline points="220,440 220,455" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="220,490 220,513" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="220,513 215,504 225,504" fill="#5b6874" /><rect x="440" y="513" width="320" height="103" rx="7" fill="#edf2fc" stroke="#9ba5ae" /><text x="600.0" y="542" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Photo agent</text><text x="600.0" y="567" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">EXIF, pixels and pHash</text><text x="600.0" y="589" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Optional image OCR</text><polyline points="600,440 600,455" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="600,490 600,513" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="600,513 595,504 605,504" fill="#5b6874" /><rect x="820" y="513" width="320" height="103" rx="7" fill="#f1f3f5" stroke="#9ba5ae" /><text x="980.0" y="542" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Hash-only agent</text><text x="980.0" y="567" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Other files and videos</text><text x="980.0" y="589" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Complete SHA-256 bytes</text><polyline points="980,440 980,455" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="980,490 980,513" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="980,513 975,504 985,504" fill="#5b6874" /><polyline points="220,490 980,490" fill="none" stroke="#5b6874" stroke-width="2" /><rect x="60" y="665" width="1080" height="77" rx="7" fill="#f1f3f5" stroke="#9ba5ae" /><text x="600.0" y="694" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Global catalog, extraction cache and event history</text><text x="600.0" y="719" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">All selected years combine here | Source IDs, checksums, dates and provenance</text><polyline points="220,616 220,640 600,640" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="600,616 600,640 600,640" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="980,616 980,640 600,640" fill="none" stroke="#5b6874" stroke-width="2" /><polyline points="600,640 600,665" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="600,665 595,656 605,656" fill="#5b6874" /><rect x="60" y="787" width="520" height="81" rx="7" fill="#fff0ea" stroke="#9ba5ae" /><text x="320.0" y="816" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Duplicate evidence agent</text><text x="320.0" y="841" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Exact bytes vs pixels, text and visual similarity</text><rect x="620" y="787" width="520" height="81" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="880.0" y="816" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Subject and consolidation agents</text><text x="880.0" y="841" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Topic reading packs with source references</text><polyline points="320,742 320,787" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="320,787 315,778 325,778" fill="#5b6874" /><polyline points="880,742 880,787" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="880,787 875,778 885,778" fill="#5b6874" /><rect x="60" y="912" width="520" height="78" rx="7" fill="#fff7d9" stroke="#9ba5ae" /><text x="320.0" y="941" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Human approves selected exact-byte copies</text><text x="320.0" y="966" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">No keeper may also be scheduled for removal</text><rect x="620" y="912" width="520" height="78" rx="7" fill="#e9f5ef" stroke="#9ba5ae" /><text x="880.0" y="941" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Derived reading packs</text><text x="880.0" y="966" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">All originals retained | AI summaries optional</text><polyline points="320,868 320,912" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="320,912 315,903 325,903" fill="#5b6874" /><polyline points="880,868 880,912" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="880,912 875,903 885,903" fill="#5b6874" /><rect x="60" y="1033" width="520" height="80" rx="7" fill="#fff7d9" stroke="#9ba5ae" /><text x="320.0" y="1062" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Cleanup agent verifies and quarantines</text><text x="320.0" y="1087" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Rehash originals, verify backup, record journal</text><rect x="620" y="1033" width="245" height="95" rx="7" fill="#edf2fc" stroke="#9ba5ae" /><text x="742.5" y="1062" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Restore</text><text x="742.5" y="1087" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">No overwrites</text><text x="742.5" y="1109" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Backups retained</text><rect x="895" y="1033" width="245" height="95" rx="7" fill="#fdebee" stroke="#9ba5ae" /><text x="1017.5" y="1062" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#17212b">Purge locally</text><text x="1017.5" y="1087" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Second approval</text><text x="1017.5" y="1109" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#17212b">Typed confirmation</text><polyline points="320,990 320,1033" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="320,1033 315,1024 325,1024" fill="#5b6874" /><polyline points="580,1073 620,1073" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="620,1073 611,1068 611,1078" fill="#5b6874" /><polyline points="580,1095 598,1095 598,1150 1017,1150 1017,1128" fill="none" stroke="#5b6874" stroke-width="2" /><polygon points="1017,1128 1012,1137 1022,1137" fill="#5b6874" /><text x="60" y="1180" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#17212b">Local export cleanup does not delete Google Photos originals or confirm cloud space savings</text></svg>